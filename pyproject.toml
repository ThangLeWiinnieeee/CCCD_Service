[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webtutorcenter-cccd"
version = "0.1.0"
description = "Self-hosted Vietnamese citizen ID OCR and consistency checks"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.116,<1",
    "numpy>=1.26,<3",
    "opencv-contrib-python==4.10.0.84",
    "paddleocr>=3.7,<4",
    "paddlepaddle>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cccd_service"]

[tool.fastapi]
entrypoint = "cccd_service.main:app"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
